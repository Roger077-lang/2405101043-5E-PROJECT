<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin</title>
    <link rel="stylesheet" href="assets/CSS/style.css" />
  </head>
  <body>
    <div
      class="hero-bg"
      style="background-image: url(assets/Foto/Logo.jpeg)"
    ></div>
    <div class="hero-fade"></div>
    <div class="page-dim"></div>

    <header id="topbar" data-page="admin" data-search="off"></header>
    <script src="assets/Java/topbar.js"></script>

    <main class="games-page sl-page">
      
      <div class="sl">
        <section class="sl-list">
          <div class="games-head">
        <h1 class="games-title">Kelola Game</h1>
        <span class="games-count" id="adminCount"></span>
        <span class="ad-msg" id="adminMsg" role="status"></span>
      </div>
          <label class="sl-search">
            <input
              type="search"
              id="slSearch"
              placeholder="Cari judul game..."
              autocomplete="off"
            />
          </label>
          <div
            class="sl-items"
            id="adminGrid"
            role="listbox"
            aria-label="Daftar game"
          ></div>
          <div class="ad-bar sl-foot">
            <button class="sl-add" type="button" id="resetBtn">
              Reset ke default
            </button>
            <button class="sl-add" type="button" id="addBtn">
              + Tambah Game
            </button>
          </div>
        </section>

        <section class="sl-detail" id="slDetail" aria-live="polite"></section>
      </div>
    </main>

    <script src="assets/Java/games.js"></script>
    <script src="assets/Java/notif.js"></script>
    <script src="assets/Java/jam.js"></script>
    <script src="assets/Java/admin.js"></script>
  </body>
</html>
