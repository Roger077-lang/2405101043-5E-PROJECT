<!DOCTYPE html>
<html lang="id">
<head>

    <link rel="stylesheet" href="assets/CSS/style.css">
</head>
<body>
    <div class="hero-bg" style="background-image: url(assets/Foto/Logo.jpeg);"></div>

    <script src="assets/Java/topbar.js"></script>

    <main class="games-page">
        <div class="games-head">
            <h1></h1>
            <span></span>

                <button class="chip" type="button" data-filter="fav">&#9829; Favorit</button>
            </div>
        </div>

        <section class="games-grid" id="gamesGrid" aria-label="Daftar game"></section>
    </main>

    <script src="assets/Java/games.js"></script>
    <script src="assets/Java/storage.js"></script>
    <script src="assets/Java/jam.js"></script>
    <script src="assets/Java/search.js"></script>

</html>
