<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="assets/CSS/style.css" />
  </head>
  <body class="page-login">
    <div
      class="hero-bg"
      style="background-image: url(assets/Foto/Logo.jpeg)"
    ></div>
    <div class="hero-fade"></div>
    <div class="page-dim"></div>
    <div class="lg-clock" id="clock"></div>

    <h1>Selamat Datang</h1>
    <p class="sub">Pilih metode Login anda</p>
    <br /><br />

    <div class="users" id="users">
      <button class="user add" type="button" data-role="add">
        <div class="av plus">+</div>
        <small>Add User</small>
      </button>
      <button class="user guest sel" type="button" data-role="guest">
        <div class="av">G</div>
        <small>Guest</small>
      </button>
      <button class="user admin" type="button" data-role="admin">
        <div class="av">
          <img src="assets/Foto/LogoH.png" />
        </div>
        <small>Admin</small>
      </button>

      <form class="pw" id="pw" autocomplete="off">
        <input
          type="password"
          id="pass"
          placeholder="Password admin"
          aria-label="Password admin"
        />
        <p id="err"></p>
      </form>
    </div>

    <script src="assets/Java/auth.js"></script>
  </body>
</html>
